<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-3</title>
    <style type="text/css">
        #dv1{
            width: 350px;
            height: 450px;
            border: 1px solid #000;
        }
        #header{
            width: 350px;

            font-size: 22px;
            font-style: italic;

    <div id="dv1">
        <div id="header">
            <p id="body-text">
                Lorem ipsum dolor sit amet, consectetur adipisicing elit. Est, at?
            </p>
        </div>
    </div>
    <img id="thumbnail" src="images/tour-img03.jpg" alt="image-1" title="Image">
